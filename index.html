<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ADLİ BİLİRKİŞİ PROTOKOLÜ (8 ADIMLI)</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .step { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #475569; }
        input, textarea { width: 100%; margin-top: 5px; background: #0f172a; color: #fff; border: 1px solid #334155; padding: 5px; }
        .final-btn { background: #10b981; color: white; padding: 15px; border: none; width: 100%; font-size: 1.2rem; cursor: pointer; border-radius: 8px; }
        #reportOutput { background: white; color: black; padding: 20px; margin-top: 20px; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>

<h1>BİLİRKİŞİ ADLİ İNCELEME PROTOKOLÜ</h1>

<div class="grid-main">
    <div id="stepsContainer">
        <!-- 8 Adım burada JS ile yüklenecek -->
    </div>
    <div>
        <button class="final-btn" onclick="buildFinalReport()">8 AŞAMALI RAPORU OLUŞTUR</button>
        <div id="reportOutput"></div>
    </div>
</div>

<script>
    const methods = [
        "1. Maske Soyma (Clipping Mask)", "2. Gizli Katman Analizi", 
        "3. Düğüm Noktası (Anchor) Analizi", "4. Renk Kodu (HEX) Karşılaştırması",
        "5. Izgara (Grid) Hizalama Kontrolü", "6. Cetvel ve Kılavuz Hizalaması",
        "7. Renk Kanalları (Separation Preview)", "8. Üst Üste Bindirme (Difference) Modu"
    ];

    const container = document.getElementById('stepsContainer');
    methods.forEach((m, i) => {
        container.innerHTML += `
            <div class="step">
                <label><b>${m}</b></label>
                <textarea id="val_${i}" placeholder="Bu yöntemle elde edilen bulgu/tespit..."></textarea>
            </div>
        `;
    });

    function buildFinalReport() {
        let findings = "";
        methods.forEach((m, i) => {
            findings += `\n${m}:\n- Tespit: ${document.getElementById('val_'+i).value || "İnceleme yapılmadı."}\n`;
        });

        const report = `T.C. BİLİRKİŞİ İNCELEME RAPORU
--------------------------------------------------
Tarih: ${new Date().toLocaleDateString()}
Konu: Fikri ve Sınai Haklar (Tasarım/Telif İhlali)

TEKNİK ANALİZ BULGULARI:
${findings}

GENEL DEĞERLENDİRME VE KANAAT:
Yukarıda belirtilen 8 aşamalı teknik analiz neticesinde; 
eserin teknik yapısı, vektörel dizilimi, renk paleti ve 
katman hiyerarşisi incelenmiş olup, [İHLAL VAR/YOK] 
yönünde kanaat oluşmuştur.

Bilirkişi İmzası`;

        const out = document.getElementById('reportOutput');
        out.innerText = report;
        out.style.display = 'block';
    }
</script>
</body>
</html>
