<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ADLİ BİLİRKİŞİ RAPOR GENERATOR</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
        .panel { max-width: 900px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 0.8rem; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; }
        button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        #finalReport { margin-top: 20px; padding: 20px; background: #fff; color: #000; border-radius: 4px; white-space: pre-wrap; font-family: 'Times New Roman', serif; }
    </style>
</head>
<body>

<div class="panel">
    <h1>Adli Bilirkişi Rapor Oluşturucu</h1>
    
    <div class="input-group">
        <label>Dosya / İddia Sahibi:</label>
        <input type="text" id="owner" placeholder="Örn: X Tasarım Ajansı">
    </div>
    <div class="input-group">
        <label>Teknik Tespit:</label>
        <select id="method">
            <option value="Difference Modu Analizi">Fark (Difference) Modu ile Örtüşme Analizi</option>
            <option value="Vektörel Düğüm Analizi">Vektörel Düğüm (Path/Anchor) İncelemesi</option>
            <option value="Katman Yapısı Analizi">Katman Yapısı ve Gizli İz İncelemesi</option>
            <option value="Renk Kodu/Palet Analizi">Renk Kimliği (HEX/RGB) Çakışması</option>
        </select>
    </div>
    <div class="input-group">
        <label>Bilirkişi Gözlemi (Bulgularınızı Yazın):</label>
        <textarea id="observation" placeholder="Örn: İki görsel üst üste bindiğinde %95 oranında piksel seviyesinde örtüşme gözlenmiştir."></textarea>
    </div>
    
    <button onclick="generateReport()">RAPOR TASLAĞINI OLUŞTUR</button>

    <div id="finalReport" style="display:none;"></div>
</div>

<script>
    function generateReport() {
        const owner = document.getElementById('owner').value;
        const method = document.getElementById('method').value;
        const obs = document.getElementById('observation').value;
        const date = new Date().toLocaleDateString('tr-TR');

        const report = `T.C. BİLİRKİŞİ RAPORU
Tarih: ${date}

KONU: Tasarım ihlali ve telif hakları incelemesi.

1. İNCELEME YÖNTEMİ:
Yapılan teknik incelemede "${method}" yöntemi kullanılmıştır.

2. TEKNİK BULGULAR:
Söz konusu ${owner} tarafından sunulan eser üzerinde yapılan dijital analizlerde; ${obs} tespit edilmiştir. 

3. SONUÇ VE KANAAT:
Yapılan ${method} sonucunda, söz konusu tasarımın özgünlük kriterlerini karşılamadığı/karşıladığı ve teknik olarak ${owner} ait eserle doğrudan bağımlılık/benzerlik gösterdiği kanaatine varılmıştır.

Bilirkişi İmza/Kaşe`;

        const display = document.getElementById('finalReport');
        display.innerText = report;
        display.style.display = 'block';
    }
</script>
</body>
</html>
