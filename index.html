<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Biometric Lie Detector v3.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #05050a; color: #00ffcc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: rgba(0, 20, 20, 0.8); border: 2px solid #00ffcc; border-radius: 12px; padding: 20px; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; text-shadow: 0 0 10px #00ffcc; letter-spacing: 2px; }
        .camera-box { position: relative; width: 100%; height: 220px; background: #000; border: 1px solid #00ffcc; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.8; }
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #ff0055; box-shadow: 0 0 10px #ff0055; animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; text-align: left; font-size: 0.85rem; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; border: 1px solid #005555; }
        .metric-item span { color: #ff0055; font-weight: bold; }
        audio-visualizer { width: 100%; height: 40px; background: #000; border: 1px solid #00ffcc; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #00ffcc; font-size: 0.8rem; }
        textarea { width: 100%; height: 80px; background: #001111; border: 1px solid #00ffcc; color: #00ffcc; padding: 10px; border-radius: 6px; resize: none; margin-bottom: 15px; font-size: 0.9rem; }
        button { background: #00ffcc; color: #05050a; border: none; padding: 12px 20px; font-weight: bold; font-size: 1rem; border-radius: 6px; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 0 15px rgba(0,255,204,0.5); }
        button:hover { background: #ff0055; color: #fff; box-shadow: 0 0 15px rgba(255,0,85,0.8); }
        #result { margin-top: 15px; font-size: 1.1rem; font-weight: bold; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BIOMETRIC LIE DETECTOR</h1>
        
        <div class="camera-box">
            <div class="scanner-line"></div>
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="metrics">
            <div class="metric-item">Göz Kırpma: <span id="blinkCount">0</span> /dk</div>
            <div class="metric-item">Ses Tonu (Pitch): <span id="voicePitch">Normal</span></div>
            <div class="metric-item">Nabız Simülasyonu: <span id="heartRate">78</span> BPM</div>
            <div class="metric-item">Durum: <span id="statusText" style="color:#00ffcc;">BEKLİYOR</span></div>
        </div>

        <div id="audioVisualizer" class="audio-visualizer">🎤 Mikrofon: Aktif (Ses Analiz Ediliyor)</div>

        <textarea id="questionInput" placeholder="Denkleyeceğiniz kişiye bir soru sorun veya kendiniz bir ifade girin..."></textarea>
        
        <button onclick="analyzeLie()">ANALİZİ BAŞLAT</button>

        <div id="result"></div>
    </div>

    <script>
        // Kamerayı Açma
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                const videoElement = document.getElementById('webcam');
                videoElement.srcObject = stream;
                
                // Mikrofon Ses Analizi (Basit Ses Seviyesi ve Ton Simülasyonu)
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioCtx.createAnalyser();
                const microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);
                analyser.fftSize = 256;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function updateAudio() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = dataArray.reduce((a, b) => a + b, 0);
                    let avg = sum / dataArray.length;
                    
                    if (avg > 15) {
                        document.getElementById('voicePitch').innerText = "Yüksek Frekans (Gergin)";
                        document.getElementById('voicePitch').style.color = "#ff0055";
                    } else {
                        document.getElementById('voicePitch').innerText = "Stabil (Normal)";
                        document.getElementById('voicePitch').style.color = "#00ffcc";
                    }
                    requestAnimationFrame(updateAudio);
                }
                updateAudio();
            })
            .catch(err => {
                console.log("Kamera/Mikrofon izni verilmedi: ", err);
                document.getElementById('audioVisualizer').innerText = "⚠️ Kamera/Mikrofon İzni Gerekli!";
            });

        // Göz Kırpma Sayacı Simülasyonu (Herkaç saniyede bir rastgele artar)
        let blinks = 0;
        setInterval(() => {
            blinks += Math.floor(Math.random() * 2);
            document.getElementById('blinkCount').innerText = blinks;
            document.getElementById('heartRate').innerText = 75 + Math.floor(Math.random() * 25);
        }, 3000);

        function analyzeLie() {
            const status = document.getElementById('statusText');
            const result = document.getElementById('result');
            const input = document.getElementById('questionInput').value;

            if(!input.trim()) {
                alert("Lütfen bir soru veya ifade girin!");
                return;
            }

            status.innerText = "ANALİZ EDİLİYOR...";
            status.style.color = "#ff0055";
            result.innerText = "";

            setTimeout(() => {
                const outcomes = [
                    { text: "SONUÇ: %98 DOĞRU (Yalan tespit edilmedi.)", color: "#00ffcc" },
                    { text: "SONUÇ: %89 RİSKLİ! Ses tonunda ani dalgalanma!", color: "#ffaa00" },
                    { text: "SONUÇ: %99 KESİN YALAN! Göz kırpma hızı ve nabız tavan yaptı!", color: "#ff0055" }
                ];
                
                const randomOutcome = outcomes[Math.floor(Math.random() * outcomes.length)];
                status.innerText = "TAMAMLANDI";
                status.style.color = "#00ffcc";
                result.innerText = randomOutcome.text;
                result.style.color = randomOutcome.color;
                result.style.border = `1px solid ${randomOutcome.color}`;
                result.style.background = "rgba(0,0,0,0.7)";
            }, 2500);
        }
    </script>
</body>
</html>
