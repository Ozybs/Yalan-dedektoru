<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>GRAFİK BİLİRKİŞİ - ADLİ İNCELEME PANELİ</title>
    <style>
        body { background: #0b0e14; color: #d1d5db; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; }
        .dashboard { max-width: 1000px; margin: auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .panel { background: #1a1f29; padding: 20px; border-radius: 8px; border: 1px solid #374151; }
        h2 { color: #3b82f6; font-size: 1.1rem; border-bottom: 1px solid #374151; padding-bottom: 10px; }
        .btn-list button { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 10px; background: #2d3748; border: none; color: white; cursor: pointer; border-radius: 4px; }
        .btn-list button:hover { background: #4a5568; }
        #logArea { width: 100%; height: 300px; background: #000; color: #00ff00; padding: 15px; font-family: monospace; overflow-y: scroll; border: 1px solid #3b82f6; }
        .info-box { line-height: 1.6; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="panel">
        <h2>ADLİ İNCELEME YÖNTEMLERİ</h2>
        <div class="btn-list" id="methods">
            <!-- Yöntem butonları buraya gelecek -->
        </div>
    </div>
    
    <div class="panel">
        <h2>BULGU VE RAPORLAMA</h2>
        <div id="instruction" class="info-box">Yöntem seçiniz.</div>
        <textarea id="reportField" style="width:100%; height:150px; margin-top:20px; background:#111; color:#fff; padding:10px;" placeholder="İnceleme notlarınızı buraya düşerek resmi rapora hazırlayınız..."></textarea>
        <button onclick="saveReport()" style="margin-top:10px; width:100%; padding:10px; background:#3b82f6; color:white; border:none;">RAPORU KOPYALA</button>
    </div>
</div>

<script>
    const protocol = {
        1: { name: "1. Maske Soyma (Clipping)", desc: "İçerik gizleme/maskeleme kontrolü.", shortcut: "PS: Alt+Ctrl+G / AI: Alt+Ctrl+7" },
        2: { name: "2. Gizli Katman Analizi", desc: "Silinmemiş/gizlenmiş katmanların, 'göz' ikonları ile tek tek incelenmesi.", shortcut: "F7" },
        3: { name: "3. Düğüm Noktası (Vektör) Analizi", desc: "Direct Selection (A) ile çizimin özgünlüğü ve 'Auto-trace' kullanımı kontrolü.", shortcut: "A" },
        4: { name: "4. Renk/HEX Analizi", desc: "Damlalık (I) ile renk kimliği tespiti, marka standartlarıyla uyum kontrolü.", shortcut: "I" },
        5: { name: "5. Izgara (Grid) Hizalama", desc: "Gridler (Ctrl+') ile tasarımın geometrik iskeletinin karşılaştırılması.", shortcut: "Ctrl + ' / \"" },
        6: { name: "6. Cetvel/Kılavuz Kontrolü", desc: "Cetveller (Ctrl+R) ile hizalama eksenlerinin örtüşme analizi.", shortcut: "Ctrl + R" },
        7: { name: "7. Ayrım Önizleme (Separation)", desc: "CMYK/Siyah (K) kanalları üzerinden baskı kalıbı ve hile analizi.", shortcut: "Window -> Separations Preview" },
        8: { name: "8. Fark Modu (Difference)", desc: "İki eseri üst üste koyup fark moduna alarak %100 örtüşme (kopya) kontrolü.", shortcut: "Blending Mode: Difference" }
    };

    function init() {
        const list = document.getElementById('methods');
        for (let i in protocol) {
            let btn = document.createElement('button');
            btn.innerText = protocol[i].name;
            btn.onclick = () => {
                document.getElementById('instruction').innerHTML = `<b>YÖNTEM:</b> ${protocol[i].name}<br><b>ADLİ PROTOKOL:</b> ${protocol[i].desc}<br><b>TEKNİK KISAYOL:</b> <span style="color:#ffcc00">${protocol[i].shortcut}</span>`;
            };
            list.appendChild(btn);
        }
    }

    function saveReport() {
        const text = document.getElementById('reportField').value;
        navigator.clipboard.writeText(text);
        alert("Rapor notları panoya kopyalandı.");
    }
    init();
</script>
</body>
</html>
