<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilirkişi Adli İnceleme Paneli</title>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .sidebar { background: #1e293b; padding: 15px; border-radius: 8px; }
        .method-btn { display: block; width: 100%; text-align: left; background: #334155; color: white; padding: 10px; margin-bottom: 8px; border: none; cursor: pointer; border-radius: 4px; }
        .method-btn:hover { background: #475569; }
        .main-panel { background: #1e293b; padding: 20px; border-radius: 8px; }
        .instruction-box { background: #000; padding: 15px; border-left: 4px solid #3b82f6; margin-bottom: 15px; font-size: 0.9rem; }
        textarea { width: 100%; height: 80px; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; }
    </style>
</head>
<body>

<h2>BİLİRKİŞİ ADLİ İNCELEME PANELİ</h2>
<div class="grid">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-panel">
        <div id="instruction-display" class="instruction-box">Bir yöntem seçerek incelemeye başlayın.</div>
        <label>Bu Yöntemle İlgili Rapor Notu:</label>
        <textarea id="note-area" placeholder="Analiz sonucunu buraya girin..."></textarea>
        <button onclick="saveNote()" style="margin-top:10px; background:#10b981; border:none; padding:10px; color:white; width:100%;">RAPORA EKLE</button>
    </div>
</div>

<script>
    const methods = [
        { name: "1. Maske Soyma (Clipping)", info: "Kısayol: PS: Alt+Ctrl+G / AI: Alt+Ctrl+7. Nesne -> Kırpma Maskesi -> Serbest Bırak." },
        { name: "2. Kapalı Katmanları Açma", info: "Kısayol: F7 (Katmanlar paneli). Göz (👁️) simgelerine tıklayarak gizli katmanları görünür kıl." },
        { name: "3. Düğüm Noktası (Path)", info: "Kısayol: 'A' (Direct Selection Tool). Vektörel düğüm noktalarını ve kavis açılarını incele." },
        { name: "4. Renk Kodu Ölçme", info: "Kısayol: 'I' (Damlalık). Rengi seç, Color Picker'dan #HEX kodunu kopyala." },
        { name: "5. Izgara (Grid) Açma", info: "Kısayol: Ctrl + ' (PS) / Ctrl + \" (AI). Tasarımın milimetrik hizasını kontrol et." },
        { name: "6. Cetveller (Rulers)", info: "Kısayol: Ctrl + R. Cetvelden sürükleyip kılavuz çizgisi oluştur ve hizalama kontrolü yap." },
        { name: "7. Ayrım Önizleme", info: "Yol: Pencere (Window) -> Ayrım Önizleme (Separations Preview). CMYK kanallarını kapatıp K (Siyah) baskısını izle." },
        { name: "8. Fark Modu (Difference)", info: "Yol: Katmanlar -> Fark (Difference) moduna al. %50 saydamlık vererek örtüşme analizi yap." }
    ];

    const sidebar = document.getElementById('sidebar');
    methods.forEach((m, i) => {
        let btn = document.createElement('button');
        btn.className = 'method-btn';
        btn.innerText = m.name;
        btn.onclick = () => {
            document.getElementById('instruction-display').innerText = m.info;
        };
        sidebar.appendChild(btn);
    });

    function saveNote() {
        const note = document.getElementById('note-area').value;
        console.log("Rapor notu eklendi:", note);
        alert("Notunuz rapor hafızasına işlendi.");
    }
</script>
</body>
</html>
