<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Biometric Lie Detector v4.0 - Ultimate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #020205; color: #00ffcc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; padding: 20px; position: relative; }
        
        /* Matrix Arka Plan Efekti */
        canvas#matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }

        .container { width: 100%; max-width: 600px; background: rgba(5, 15, 15, 0.85); border: 2px solid #00ffcc; border-radius: 12px; padding: 20px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.3); text-align: center; backdrop-filter: blur(5px); z-index: 1; }
        h1 { font-size: 1.4rem; margin-bottom: 5px; text-shadow: 0 0 10px #00ffcc; letter-spacing: 2px; }
        .subtitle { font-size: 0.75rem; color: #ff0055; margin-bottom: 15px; letter-spacing: 1px; }
        
        .camera-box { position: relative; width: 100%; height: 200px; background: #000; border: 1px solid #00ffcc; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.85; }
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #ff0055; box-shadow: 0 0 12px #ff0055; animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; text-align: left; font-size: 0.8rem; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 6px; border: 1px solid #005555; }
        .metric-item span { color: #ff0055; font-weight: bold; }

        .ai-question-box { background: rgba(0, 255, 204, 0.05); border: 1px dashed #00ffcc; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; color: #fff; }
        .ai-question-box span { color: #00ffcc; font-weight: bold; }

        .audio-visualizer { width: 100%; height: 35px; background: #000; border: 1px solid #00ffcc; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; color: #00ffcc; font-size: 0.75rem; border-radius: 4px; }
        
        textarea { width: 100%; height: 70px; background: #001111; border: 1px solid #00ffcc; color: #00ffcc; padding: 10px; border-radius: 6px; resize: none; margin-bottom: 12px; font-size: 0.85rem; }
        
        .button-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { background: #00ffcc; color: #05050a; border: none; padding: 10px; font-weight: bold; font-size: 0.9rem; border-radius: 6px; cursor: pointer; flex: 1; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        button:hover { background: #ff0055; color: #fff; box-shadow: 0 0 15px rgba(255,0,85,0.8); }
        button.secondary { background: #111; color: #00ffcc; border: 1px solid #00ffcc; }

        #result { margin-top: 10px; font-size: 1rem; font-weight: bold; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- Matrix Arka Plan Canvas -->
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>BIOMETRIC LIE DETECTOR</h1>
        <div class="subtitle">SECURE_AI_SYSTEM // v4.0 ULTIMATE</div>
        
        <div class="camera-box">
            <div class="scanner-line"></div>
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="ai-question-box">
            🤖 <span>Yapay Zeka Sorgusu:</span><br>
            <strong id="aiPromptText">"Son 24 saat içinde gizli bir işler çevirdin mi?"</strong>
        </div>

        <div class="metrics">
            <div class="metric-item">Göz Kırpma: <span id="blinkCount">0</span> /dk</div>
            <div class="metric-item">Ses Tonu (Pitch): <span id="voicePitch">Stabil</span></div>
            <div class="metric-item">Nabız Simülasyonu: <span id="heartRate">78</span> BPM</div>
            <div class="metric-item">Durum: <span id="statusText" style="color:#00ffcc;">BEKLİYOR</span></div>
        </div>

        <div id="audioVisualizer" class="audio-visualizer">🎤 Mikrofon: Aktif (Ses Dalgaları Dinleniyor)</div>

        <textarea id="questionInput" placeholder="Cevabınızı buraya yazın veya ifade verin..."></textarea>
        
        <div class="button-group">
            <button onclick="changeQuestion()" class="secondary">YENİ SORU</button>
            <button onclick="analyzeLie()">ANALİZİ BAŞLAT</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        // 1. Matrix Arka Plan Efekti
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;
        const letters = "0101010101ABCDEFXYZ<[#]>_QNTM";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 2, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // 2. Kamera ve Mikrofon Entegrasyonu
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                document.getElementById('webcam').srcObject = stream;
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioCtx.createAnalyser();
                const microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);
                analyser.fftSize = 256;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function updateAudio() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = dataArray.reduce((a, b) => a + b, 0);
                    let avg = sum / dataArray.length;
                    
                    if (avg > 15) {
                        document.getElementById('voicePitch').innerText = "Yüksek Frekans (Gergin)";
                        document.getElementById('voicePitch').style.color = "#ff0055";
                    } else {
                        document.getElementById('voicePitch').innerText = "Stabil (Normal)";
                        document.getElementById('voicePitch').style.color = "#00ffcc";
                    }
                    requestAnimationFrame(updateAudio);
                }
                updateAudio();
            })
            .catch(err => {
                console.log("Kamera/Mikrofon izni yok: ", err);
                document.getElementById('audioVisualizer').innerText = "⚠️ Kamera/Mikrofon İzni Gerekli!";
            });

        // 3. Rastgele Soru Havuzu
        const questions = [
            "Son 24 saat içinde gizli bir işler çevirdin mi?",
            "Bana karşı tamamen dürüst müştün?",
            "Geçmişte büyük bir yalan söyleyip yakalanmadığın oldu mu?",
            "Şu an kalbinin hızla çarptığını saklamaya mı çalışıyorsun?",
            "En yakın arkadaşına bile söylediğin büyük bir sırrın var mı?"
        ];

        function changeQuestion() {
            const randomQ = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('aiPromptText').innerText = `"${randomQ}"`;
        }

        // 4. Göz Kırpma ve Nabız Simülasyonu
        let blinks = 0;
        setInterval(() => {
            blinks += Math.floor(Math.random() * 2);
            document.getElementById('blinkCount').innerText = blinks;
            document.getElementById('heartRate').innerText = 74 + Math.floor(Math.random() * 26);
        }, 3000);

        // 5. Sesli Konuşma (Text-to-Speech) Fonksiyonu
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 6. Analiz ve Sonuç Algoritması
        function analyzeLie() {
            const status = document.getElementById('statusText');
            const result = document.getElementById('result');
            const input = document.getElementById('questionInput').value;

            status.innerText = "BIOMETRİK TARAMA YAPILIYOR...";
            status.style.color = "#ff0055";
            result.innerText = "";

            setTimeout(() => {
                const outcomes = [
                    { text: "SONUÇ: %98 DOĞRU (Biyometrik veriler stabil, yalan tespit edilmedi.)", color: "#00ffcc", speak: "Sonuç yüzde doksan sekiz doğru. Yalan tespit edilmedi." },
                    { text: "SONUÇ: %85 RİSKLİ! Ses tonunda ve nabızda ani dalgalanma!", color: "#ffaa00", speak: "Sonuç seksen beş riskli. Ses tonunda dalgalanma saptandı." },
                    { text: "SONUÇ: %99 KESİN YALAN! Göz hareketleri ve stres seviyesi tavan yaptı!", color: "#ff0055", speak: "Sonuç yüzde doksan dokuz keskin yalan! Stres seviyesi tavan yaptı." }
                ];
                
                const randomOutcome = outcomes[Math.floor(Math.random() * outcomes.length)];
                status.innerText = "ANALİZ TAMAMLANDI";
                status.style.color = "#00ffcc";
                result.innerText = randomOutcome.text;
                result.style.color = randomOutcome.color;
                result.style.border = `1px solid ${randomOutcome.color}`;
                result.style.background = "rgba(0,0,0,0.8)";

                // Yapay zeka sonucu sesli olarak okusun
                speakText(randomOutcome.speak);
            }, 2500);
        }
    </script>
</body>
</html>
