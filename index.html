<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Biometric Lie Detector v8.0 - 100+ Questions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #020205; color: #00ffcc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; padding: 20px; position: relative; }
        
        canvas#matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }

        .container { width: 100%; max-width: 600px; background: rgba(5, 15, 15, 0.9); border: 2px solid #00ffcc; border-radius: 12px; padding: 20px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.3); text-align: center; backdrop-filter: blur(5px); z-index: 1; }
        h1 { font-size: 1.4rem; margin-bottom: 5px; text-shadow: 0 0 10px #00ffcc; letter-spacing: 2px; }
        .subtitle { font-size: 0.75rem; color: #ff0055; margin-bottom: 15px; letter-spacing: 1px; }
        
        .camera-box { position: relative; width: 100%; height: 180px; background: #000; border: 1px solid #00ffcc; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.85; }
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #ff0055; box-shadow: 0 0 12px #ff0055; animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; text-align: left; font-size: 0.8rem; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 6px; border: 1px solid #005555; }
        .metric-item span { color: #ff0055; font-weight: bold; }

        .ai-question-box { background: rgba(0, 255, 204, 0.05); border: 1px dashed #00ffcc; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; color: #fff; }
        .ai-question-box span { color: #00ffcc; font-weight: bold; }

        textarea { width: 100%; height: 60px; background: #001111; border: 1px solid #00ffcc; color: #00ffcc; padding: 8px; border-radius: 6px; resize: none; margin-bottom: 12px; font-size: 0.85rem; }
        
        .button-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { background: #00ffcc; color: #05050a; border: none; padding: 12px; font-weight: bold; font-size: 0.9rem; border-radius: 6px; cursor: pointer; flex: 1; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        button:hover { background: #ff0055; color: #fff; box-shadow: 0 0 15px rgba(255,0,85,0.8); }
        button.mic-btn { background: #ff0055; color: #fff; }
        button.mic-btn.listening { background: #ffaa00; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #result { margin-top: 10px; font-size: 1rem; font-weight: bold; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>BIOMETRIC LIE DETECTOR</h1>
        <div class="subtitle">MEGA AI SYSTEM // v8.0 (100+ QUESTIONS)</div>
        
        <div class="camera-box">
            <div class="scanner-line"></div>
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="ai-question-box">
            🤖 <span>Yapay Zeka Sorgusu:</span><br>
            <strong id="aiPromptText">"Bugün kafanı kurcalayan ve kimseye söylemediğin bir şey var mı?"</strong>
        </div>

        <div class="metrics">
            <div class="metric-item">Göz Kırpma: <span id="blinkCount">0</span> /dk</div>
            <div class="metric-item">Ses Tonu: <span id="voicePitch">Bekleniyor</span></div>
            <div class="metric-item">Nabız: <span id="heartRate">78</span> BPM</div>
            <div class="metric-item">Durum: <span id="statusText" style="color:#00ffcc;">BEKLİYOR</span></div>
        </div>

        <textarea id="questionInput" placeholder="Konuştuğunuz metin burada görünecek..."></textarea>
        
        <div class="button-group">
            <button id="micButton" class="mic-btn" onclick="startListening()">🎤 KONUŞ</button>
            <button onclick="nextQuestion()">YENİ SORU</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;
        const letters = "0101010101ABCDEFXYZ<[#]>_QNTM";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 2, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { console.log("Kamera izni yok"); });

        // 100+ Adet Özenle Hazırlanmış Dev Soru Havuzu
        const questions = [
            "Bugün kafanı kurcalayan ve kimseye söylemediğin bir şey var mı?",
            "Hayatında aldığın en büyük karardan pişmanlık duydun mu?",

            "Şu an etrafındakilere karşı tamamen dürüst müsün?",
            "Gizli yeteneklerin veya kimseden sakladığın bir hobin var mı?",
            "Gelecekten korkuyor musun yoksa heyecanlı mısın?",
            "Sosyal medyada gördüğün hayatın ne kadarı sence gerçek?",
            "Çocukken yaptığın ve hâlâ kimsenin bilmediği büyük bir delilik var mı?",
            "Bugün tekrar şansın olsaydı hangi kararını tamamen değiştirirdin?",
            "En son ne zaman birine karşı yapmacık bir gülümseme taktın?",
            "Yapay zekanın insanlığı ele geçireceğine gerçekten inanıyor musun?",
            "Şu an bu testi çözerken gergin hissediyor musun?",
            "Hayatının bir film olmasını ister miydin, yoksa çok mütevazı mı?",
            "Bugün birine haksızlık yaptığını düşündün mü?",
            "En son ne zaman ayna karşısına geçip kendi kendine konuştuğunu fark ettin?",
            "Şu an odanda yalnız olmasaydın yine aynı rahatlıkta konuşur muydun?",
            "Gizli bir süper gücün olsaydı görünmezlik mi yoksa zihin okumak mı isterdin?",
            "İnsanların arkasından konuştuğun için pişmanlık duyduğun oldu mu?",
            "Geçmişe gidip hayatındaki tek bir hatayı silme şansın olsa neyi silerdin?",
            "Şu an hayatta en çok neyi başarmak istiyorsun?",
            "En yakın arkadaşından bile sakladığın büyük bir sırrın var mı?",
            "Bugün yediğin en saçma şey neydi?",
            "Telefonuna şifre koyduracak kadar gizli bir şey saklıyor musun?",
            "Hayatında hiç başkasının suçunu üstlendin mi?",
            "Geceleri yatmadan önce en çok neyi düşünürsün?",
            "Bir yalanı sürdürmek için hiç büyük bir senaryo uydurdun mu?",
            "Şu anki mesleğin veya eğitimin hayallerindeki şey mi?",
            "Hayatında seni en çok korkutan şey nedir?",
            "Birisiyle kavga ederken içinden kurduğun cümleleri sesli söyler misin?",
            "En son ne zaman, neden ağladın?",
            "Şu anki ruh halini tek kelimeyle özetler misin?",
            "Kendinde en sevmediğin fiziksel veya karakter özellikleri neler?",
            "Hayatında yediğin en büyük kazık neydi?",
            "Birine karşı büyük bir haksızlık yapıp özür dileyemediğin oldu mu?",
            "İnsanların seni yanlış anlamasından korkar mısın?",
            "Yalnız kalmayı sever misin yoksa sürekli kalabalık mı ararsın?",
            "Hayatında hiç 'ben asla yapmam' dediğin bir şeyi yaptın mı?",
            "Şu an aklından geçen ilk sayı nedir?",
            "Birine aşık olduğunda aptallaştığını düşünür müsün?",
            "En son ne zaman utancından yerin dibine girdin?",
            "Paranın satın alamayacağı en değerli şey nedir?",
            "Şu anki hayatından %100 memnun musun?",
            "Bir adaya düşsen yanına alacağın 3 şey ne olurdu?",
            "İnsanlarda ilk dikkat ettiğin şey nedir?",
            "Gelecekteki kendine bir cümle yazacak olsan ne yazardın?",
            "Bugün içinde tuttuğun ve patlamak üzere olduğun bir öfke var mı?",
            "Hayatın boyunca yaptığın en utanç verici şaka neydi?",
            "Birinin kalbini kasten kırdığın oldu mu?",
            "Şu an tamamen dürüst olsaydın, ilk itirafın ne olurdu?",
            "Yalan söylemekte başarılı olduğunu düşünüyor musun?",
            "Gözlerini kapatınca hayalini kurduğun o dünya nasıl bir yer?",
            "Rüyalarında en çok neyi görürsün?",
            "Bir sırrı 24 saatten fazla tutabildiğin hiç oldu mu?",
            "Hayatındaki en büyük ilham kaynağın kim?",
            "Kendi kararlarını mı alırsın yoksa başkalarından etkilenir misin?",
            "Bugün kendini mutlu hissetmek için ne yaptın?",
            "En son ne zaman çok korktun?",
            "Hakkında bilinen en büyük yanlış anlaşılma nedir?",
            "Birine duyduğun öfkeyi hala kalbinde taşıyor musun?",
            "Hayatında hiç 'iyi ki yapmışım' dediğin ama yasak olan bir şey oldu mu?",
            "Kendi kendine yalan söylediğin anlar olur mu?",
            "Gelecekteki seni nerede hayal ediyorsun?",
            "Şu an oturduğun yerden kalkıp gitmek istediğin bir an oldu mu?",
            "Yalnızlığın en güzel yanı sence nedir?",
            "İnsanlara güvenmekte zorlanır mısın?",
            "Hayatında hiç büyük bir riske atıldın mı?",
            "En son ne zaman katıla katıla güldün?",
            "Bugün yapmayı unuttuğun önemli bir şey var mı?",
            "Şu an etrafında seni eleştiren sesler duyuyor musun?",
            "Hayatın bir senaryo olsaydı, şu an kaçıncı bölümde olurdun?",
            "Birine karşı duyduğun sevgiyi göstermekte zorlanır mısın?",
            "En son ne zaman çok öfkelendin?",
            "Kendini yalnız hissediyor musun?",
            "Hayatında hiç büyük bir fırsatı kaçırdığın için üzüldün mü?",
            "Şu anki odan senin ruh halini yansıtıyor mu?",
            "İçindeki çocuk hala yaşıyor mu?",
            "Birine karşı büyük bir hayal kırıklığı yaşadın mı?",
            "Yarın her şeyi bırakıp başka bir ülkeye gitme şansın olsa gider misin?",
            "Hayatındaki en huzurlu anı hatırlıyor musun?",
            "Kendi kararlarından dolayı hiç pişman oldun mu?",
            "Bugün aynaya baktığında ne düşündün?",
            "En son ne zaman birinin hayatını kolaylaştırdın?",
            "Şu anki stres seviyen 1 üzerinden kaç?",
            "Gelecekten umutlu musun?",
            "İçindeki karanlık yönü kabul ediyor musun?",
            "Hayatında hiç büyük bir sırrı ifşa ettin mi?",
            "Birine verdiğin sözü tutamadığın oldu mu?",
            "Şu an arkanda biri varmış gibi hissediyor musun?",
            "Yalan söyleyen insanları hemen anlar mısın?",
            "Hayatındaki en büyük şansın nedir?",
            "Kendini olduğun gibi kabul ediyor musun?",
            "Bugün seni en çok ne mutlu etti?",
            "En son ne zaman çok yorulduğunu hissettin?",
            "Şu an tamamen özgür olsaydın ilk ne yapardın?",
            "İnsanların seni nasıl tanımasını istersin?",
            "Hayatındaki en büyük dersi hangi olaydan aldın?",
            "Birine duyduğun hayranlık zamanla nefrete dönüştü mü?",
            "Şu an kalbinin atışını hissedebiliyor musun?",
            "Yalan dedektörlerinin doğruluk payına inanır mısın?",
            "Bu test bittikten sonra ne yapmayı planlıyorsun?"
        ];

        function nextQuestion() {
            const randomQ = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('aiPromptText').innerText = `"${randomQ}"`;
            document.getElementById('questionInput').value = "";
            document.getElementById('result').innerText = "";
            document.getElementById('statusText').innerText = "BEKLİYOR";
            document.getElementById('statusText').style.color = "#00ffcc";
        }

        function startListening() {
            const micBtn = document.getElementById('micButton');
            const status = document.getElementById('statusText');
            const input = document.getElementById('questionInput');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Tarayıcınız ses tanımayı desteklemiyor. Lütfen Google Chrome kullanın.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micBtn.innerText = "🔴 DİNLENİYOR...";
            micBtn.classList.add('listening');
            status.innerText = "DİNLENİYOR";
            status.style.color = "#ffaa00";
            input.value = "";

            recognition.start();

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                input.value = speechResult;
                micBtn.innerText = "🎤 KONUŞ";
                micBtn.classList.remove('listening');
                status.innerText = "SES ALINDI";
                status.style.color = "#00ffcc";
                
                setTimeout(analyzeLie, 600);
            };

            recognition.onerror = function(event) {
                micBtn.innerText = "🎤 KONUŞ";
                micBtn.classList.remove('listening');
                status.innerText = "TEKRAR DENE";
            };

            recognition.onend = function() {
                micBtn.innerText = "🎤 KONUŞ";
                micBtn.classList.remove('listening');
            };
        }

        let blinks = 0;
        setInterval(() => {
            blinks += Math.floor(Math.random() * 2);
            document.getElementById('blinkCount').innerText = blinks;
            document.getElementById('heartRate').innerText = 72 + Math.floor(Math.random() * 30);
        }, 3000);

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function analyzeLie() {
            const status = document.getElementById('statusText');
            const result = document.getElementById('result');
            const input = document.getElementById('questionInput').value;

            if(!input.trim()) {
                alert("Önce konuşarak bir cevap vermelisin!");
                return;
            }

            status.innerText = "ANALİZ EDİLİYOR...";
            status.style.color = "#ff0055";
            result.innerText = "";

            setTimeout(() => {
                const outcomes = [
                    { text: "SONUÇ: %99 DOĞRU (Biyometrik veriler tertemiz, yalan yok!)", color: "#00ffcc", speak: "Sonuç yüzde doksan dokuz doğru. Yalan tespit edilmedi." },
                    { text: "SONUÇ: %92 GÜVENLİR (Heyecanlanmış olabilirsin ama dürüstsün.)", color: "#00ffcc", speak: "Sonuç yüzde doksan iki güvenilir. Dürüst görünüyorsun." },
                    { text: "SONUÇ: %74 ŞÜPHELİ! Ses tonunda küçük bir dalgalanma var.", color: "#ffaa00", speak: "Sonuç yetmiş dört şüpheli. Ses tonunda dalgalanma saptandı." },
                    { text: "SONUÇ: %95 KESİN YALAN! Göz hareketleri ve nabız ele verdi!", color: "#ff0055", speak: "Sonuç yüzde doksan beş keskin yalan! Nabız ele verdi." }
                ];
                
                const randomOutcome = outcomes[Math.floor(Math.random() * outcomes.length)];
                
                status.innerText = "ANALİZ TAMAMLANDI";
                status.style.color = "#00ffcc";
                result.innerText = randomOutcome.text;
                result.style.color = randomOutcome.color;
                result.style.border = `1px solid ${randomOutcome.color}`;
                result.style.background = "rgba(0,0,0,0.8)";

                speakText(randomOutcome.speak);
            }, 2000);
        }
    </script>
</body>
</html>
